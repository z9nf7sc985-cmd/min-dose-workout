name: Build icons & publish to GitHub Pages
# Pages serves the gh-pages branch. Every push to main rebuilds icons and
# force-publishes the site files (without .github/) to gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG icons from base64 sources
        run: |
          mkdir -p icons
          for f in icons-src/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "icons/$n"; done
      - name: Commit icons to main (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || (git commit -m "Build PNG icons" && git push)
      - name: Publish site to gh-pages branch
        run: |
          git checkout --orphan gh-pages-publish
          git rm -r -q --cached .github icons-src
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f origin HEAD:gh-pages
