<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MinDose — Full-Body Workout</title>
<meta name="description" content="Zero-equipment, minimum-effective-dose full-body workouts for your living room or parked car. Hit every muscle in 2-3 short sessions a week.">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MinDose">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">●</span> MinDose</div>
  <div class="streak" id="streakChip" title="Weekly streak">🔥 0</div>
</header>
<main id="view" class="view" aria-live="polite"></main>

<div id="timer" class="timer hidden" role="dialog" aria-label="Rest timer">
  <div class="timer-inner">
    <div class="timer-label">Rest</div>
    <div class="timer-time" id="timerTime">0:00</div>
    <div class="timer-bar"><div id="timerBar"></div></div>
    <div class="timer-btns">
      <button class="btn ghost" data-t="-15">−15s</button>
      <button class="btn ghost" data-t="+15">+15s</button>
      <button class="btn" data-t="skip">Skip</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet hidden" role="dialog"><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast hidden"></div>

<nav class="tabbar" role="tablist">
  <button data-tab="today" class="active"><span class="ti">🏋️</span>Today</button>
  <button data-tab="progress"><span class="ti">📊</span>Muscles</button>
  <button data-tab="history"><span class="ti">🗓️</span>History</button>
  <button data-tab="program"><span class="ti">📘</span>Program</button>
</nav>
<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
